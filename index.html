<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our First Date ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffb6d9,#ffdce9);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:600px;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
text-align:center;
position:relative;
z-index:2;
animation:fade 1s;
}

h1{
color:#ff4d88;
margin-bottom:10px;
}

p{
margin-bottom:15px;
}

.notice{
background:#fff5f8;
border:2px solid #ffc2d6;
padding:12px;
border-radius:12px;
font-size:14px;
margin-bottom:20px;
color:#555;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:2px solid #ffb3cf;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#ff4d88;
color:white;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#ff2d74;
}

#result{
display:none;
margin-top:25px;
background:#fff0f6;
padding:20px;
border-radius:15px;
}

.heart{
position:fixed;
bottom:-20px;
font-size:25px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(0) rotate(0);
opacity:0;
}
20%{opacity:1;}
100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<h1>Will You Go on Our First Date? ❤️</h1>

<p>I made this little website because asking you out deserves something special.</p>

<div class="notice">
❤️ By clicking <strong>Send My Answer</strong>, your selected date plans will be sent to Rave so he can prepare everything for our date.
</div>

<select id="type">
<option>Simple Mall Date 🛍️</option>
<option>Coffee Date ☕</option>
<option>Cinema Date 🎬</option>
<option>Picnic 🌸</option>
<option>Dinner Date 🍽️</option>
<option>Arcade Date 🎮</option>
</select>

<input type="date" id="date">

<input type="time" id="time">

<select id="food">
<option>Pizza 🍕</option>
<option>Chicken 🍗</option>
<option>Burger 🍔</option>
<option>Pasta 🍝</option>
<option>Steak 🥩</option>
<option>Ice Cream 🍨</option>
<option>Coffee ☕</option>
<option>Chocolate 🍫</option>
</select>

<input type="time" id="pickup" placeholder="Pickup Time">

<button onclick="sendAnswer()">Send My Answer ❤️</button>

<div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init({
publicKey:"OowRwQDYcGfs97bIk"
});

function sendAnswer(){

let type=document.getElementById("type").value;
let date=document.getElementById("date").value;
let time=document.getElementById("time").value;
let food=document.getElementById("food").value;
let pickup=document.getElementById("pickup").value;

emailjs.send("service_ljlth0i","template_gad3bkt",{
date_type:type,
date:date,
time:time,
food:food,
pickup:pickup
}).then(function(){

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=`
<h2>Thank You, My Love ❤️</h2>

<p>
You have no idea how happy this made me.
Seeing your choices already makes me imagine our first date together.
I can't wait to spend the day laughing with you, eating our favorite food,
and making memories that we'll always remember.
Thank you for giving me the chance to spend my time with the most wonderful
person I know. I love you so much, and I'm already excited to see your smile.
❤️
</p>
`;

}).catch(function(error){
alert("Failed to send: "+JSON.stringify(error));
});

}

function heart(){

const h=document.createElement("div");

h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*20)+"px";
h.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(h);

setTimeout(()=>h.remove(),10000);

}

setInterval(heart,300);
</script>

</body>
</html>
